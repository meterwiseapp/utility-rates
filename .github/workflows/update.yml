name: LADWP Auto Update
on:
  schedule:
    - cron: '0 10 1 * *' 
  workflow_dispatch: 
    inputs:
      dry_run:
        description: 'Dry Run (Check for changes but do not save)'
        required: true
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 

      - name: Setup Python
        uses: actions/setup-python@v5 
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4

      - name: Run Scraper
        # Passes --dry-run to the script if the checkbox is checked
        run: |
          python scrapers/update_rates.py ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Commit and Push Changes
        # This step is skipped entirely if dry_run is true
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config --global user.name 'LADWP-Bot'
          git config --global user.email 'bot@utilityestimator.com'

          # 1. Stamp today's date (YYYY-MM-DD) into lastUpdated regardless of rate changes
          TODAY=$(date -u +"%Y-%m-%d")
          jq --arg d "$TODAY" '.lastUpdated = $d' rates/ladwp_rates.json > tmp.json && mv tmp.json rates/ladwp_rates.json

          # 2. Stage both file locations
          git add rates/ladwp_rates.json
          cp rates/ladwp_rates.json ladwp_rates.json || true
          git add ladwp_rates.json

          # 3. Commit will now always succeed because lastUpdated was refreshed
          git commit -m "Automated rate update: ${TODAY}" || exit 0
          git push

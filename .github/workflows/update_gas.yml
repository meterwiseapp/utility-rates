name: SoCalGas Auto Update

on:
  schedule:
    - cron: '0 12 2 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run Mode'
        type: boolean
        required: false
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4 pdfplumber

      - name: Run Scraper
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo ">>> Running in DRY RUN mode..."
            python scrapers/update_gas.py --dry-run
          else
            echo ">>> Running in LIVE mode..."
            python scrapers/update_gas.py
          fi

      - name: Commit and Push Changes
        if: ${{ inputs.dry_run != true }}
        run: |
          git config --global user.name 'GasBot'
          git config --global user.email 'bot@utilityestimator.com'

          TODAY=$(date -u +"%Y-%m-%d")
          jq --arg d "$TODAY" '.lastUpdated = $d' rates/socalgas_rates.json > tmp.json && mv tmp.json rates/socalgas_rates.json
          
          git add rates/socalgas_rates.json
          cp rates/socalgas_rates.json socalgas_rates.json || true
          git add socalgas_rates.json
          
          # Only commit if the scraper actually found a new number
          if git diff --staged --quiet; then
            echo "No rate changes detected today."
          else
            git commit -m "Monthly Gas Rate update: $(date)"
            git push
          fi

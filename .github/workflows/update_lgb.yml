name: Long Beach Auto Update

on:
  schedule:
    # Runs at 10:00 AM UTC on October 1st and April 1st (LBU Rate Cycle Cadence)
    - cron: '0 10 1 4,10 *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run (Check for changes but do not save)'
        required: true
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 

      - name: Setup Python
        uses: actions/setup-python@v5 
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4

      - name: Run Scraper
        run: |
          python scrapers/update_lgb_rates.py ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Commit and Push Changes
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config --global user.name 'LongBeach-Bot'
          git config --global user.email 'bot@utilityestimator.com'

          TODAY=$(date -u +"%Y-%m-%d")
          jq --arg d "$TODAY" '.lastUpdated = $d' rates/longbeach_rates.json > tmp.json && mv tmp.json rates/longbeach_rates.json
          
          git add rates/longbeach_rates.json
          cp rates/longbeach_rates.json longbeach_rates.json || true
          git add longbeach_rates.json
          git commit -m "Automated Long Beach rate update: $(date)" || exit 0
          git push

name: SMUD Auto Update

on:
  schedule:
    # Runs automatically on the 1st of every month at 08:00 UTC
    - cron: '0 8 1 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run'
        required: true
        default: false
        type: boolean

jobs:
  update-smud:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run SMUD Scraper
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python scrapers/update_smud_rates.py --dry-run
          else
            python scrapers/update_smud_rates.py
          fi

      - name: Commit and Push Changes
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          TODAY=$(date -u +"%Y-%m-%d")
          jq --arg d "$TODAY" '.lastUpdated = $d' rates/smud_rates.json > tmp.json && mv tmp.json rates/smud_rates.json
          
          git add rates/smud_rates.json
          if git diff --staged --quiet; then
            echo "No changes detected in SMUD rates."
          else
            git commit -m "Auto-update SMUD residential utility rates [$(date +'%Y-%m-%d')]"
            git push
          fi
